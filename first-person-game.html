<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Person Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
            left: 0;
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            max-width: 500px;
        }

        #instructions h2 {
            margin-bottom: 10px;
            color: #4CAF50;
        }

        #instructions p {
            margin: 5px 0;
            font-size: 14px;
        }

        #instructions button {
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #instructions button:hover {
            background: #45a049;
        }

        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 10;
            display: none;
        }

        #stats.active {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* Mobile Controls */
        #mobileControls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        #mobileControls.active {
            display: block;
        }

        .joystick-container {
            position: absolute;
            width: 150px;
            height: 150px;
            pointer-events: all;
        }

        #moveJoystick {
            bottom: 30px;
            left: 30px;
        }

        #lookJoystick {
            bottom: 30px;
            right: 30px;
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            position: relative;
        }

        .joystick-stick {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        .mobile-button {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            user-select: none;
        }

        .mobile-button:active {
            background: rgba(255, 255, 255, 0.5);
        }

        #jumpButton {
            bottom: 120px;
            right: 200px;
        }

        #runButton {
            bottom: 30px;
            right: 200px;
        }

        @media (max-width: 768px), (pointer: coarse) {
            #instructions p {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="crosshair"></div>
    
    <div id="instructions">
        <h2>🎮 First Person Game</h2>
        <p id="desktopControls"><strong>WASD</strong> - Move around | <strong>Mouse</strong> - Look around<br>
        <strong>Space</strong> - Jump | <strong>Shift</strong> - Run | <strong>ESC</strong> - Unlock mouse</p>
        <p id="mobileInstructions" style="display:none;"><strong>Left Joystick</strong> - Move around<br>
        <strong>Right Joystick</strong> - Look around<br>
        <strong>Jump & Run</strong> - Use buttons on right</p>
        <button id="startButton">Click to Start</button>
    </div>

    <div id="stats">
        <div><strong>Position:</strong> <span id="position">0, 0, 0</span></div>
        <div><strong>Speed:</strong> <span id="speed">0</span></div>
        <div><strong>FPS:</strong> <span id="fps">60</span></div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobileControls">
        <!-- Movement Joystick -->
        <div id="moveJoystick" class="joystick-container">
            <div class="joystick-base">
                <div class="joystick-stick" id="moveStick"></div>
            </div>
        </div>

        <!-- Look Joystick -->
        <div id="lookJoystick" class="joystick-container">
            <div class="joystick-base">
                <div class="joystick-stick" id="lookStick"></div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div id="jumpButton" class="mobile-button">↑</div>
        <div id="runButton" class="mobile-button">⚡</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
